<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="referrer" content="no-referrer">
  <title>Citation · Yixi Zhou</title>
  <link rel="icon" href="favicon.ico" sizes="32x32">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&family=Roboto+Slab:wght@400;500;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <section id="login" class="login-shell">
    <form id="login-form" class="login-card">
      <div class="brand-mark" aria-hidden="true">C</div>
      <p class="eyebrow">CITATION TRACKER</p>
      <h1>Welcome back.</h1>
      <label for="password">访问密码</label>
      <input id="password" type="password" autocomplete="current-password" required>
      <button class="primary" id="login-button" type="submit">进入看板 <span aria-hidden="true">↗</span></button>
      <p id="login-error" role="alert"></p>
    </form>
  </section>
  <main id="dashboard" hidden>
    <header class="site-header">
      <div class="identity"><p class="eyebrow">CITATION TRACKER</p><h1 id="profile">Yixi Zhou</h1><p id="update" class="muted"></p></div>
    <section class="stats" aria-label="引用统计">
      <div class="stat"><span>总引用</span><strong id="total">—</strong></div>
      <div class="stat"><span>我的论文</span><strong id="papers-count">—</strong></div>
      <div class="stat"><span>近7日变化</span><strong id="events">—</strong></div>
      <div class="stat"><span>引用单位</span><strong id="inst-count">—</strong></div>
    </section>
      <div class="actions">
        <button id="export" class="text-action">导出 CSV</button>
        <a id="scholar" class="text-action" target="_blank" rel="noopener noreferrer" hidden>Scholar ↗</a>
        <button id="logout" class="text-action">退出</button>
      </div>
    </header>
    <p id="error" role="alert" hidden></p>
    <nav id="nav" aria-label="看板导航">
      <button class="active" data-tab="overview" aria-current="page">总览</button>
      <button data-tab="papers">我的论文</button>
      <button data-tab="citations">引用详情</button>
      <button data-tab="institutions">作者与单位</button>
    </nav>
    <section id="overview" class="tab">
      <div class="panel"><div class="section-title"><h2>引用趋势</h2><span class="section-kicker">CITATIONS OVER TIME</span></div><div id="chart"></div></div>
      <div class="panel"><div class="section-title"><h2>最近新增</h2></div><div id="recent"></div></div>
    </section>
    <section id="papers" class="tab" hidden>
      <div class="panel paper-panel">
        <div class="paper-grid table-heading"><span>论文</span><span>引用</span><span>近15日变化</span></div>
        <div id="paper-rows"></div><div id="paper-pagination" class="pagination" aria-label="论文列表分页"></div>
      </div>
    </section>
    <section id="citations" class="tab" hidden>
      <div class="filters"><label for="target">我的论文</label><select id="target"></select><span id="result-count" class="muted"></span></div>
      <div class="panel citation-panel"><div id="citation-list"></div><div id="citation-pagination" class="pagination" aria-label="引用列表分页"></div></div>
    </section>
    <section id="institutions" class="tab" hidden>
      <div class="two-columns">
        <div class="panel"><div class="section-title"><h2>引用论文所属单位</h2></div><div id="institution-list"></div><div id="institution-pagination" class="pagination" aria-label="单位列表分页"></div></div>
        <div class="panel"><div class="section-title"><h2>引用作者</h2></div><div id="author-list"></div><div id="author-pagination" class="pagination" aria-label="作者列表分页"></div></div>
      </div>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
