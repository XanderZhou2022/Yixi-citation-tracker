name: Checks and Pages
on:
  push:
    branches: [main, master]
  pull_request:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: ${{ github.event_name == 'pull_request' && format('checks-{0}', github.event.number) || 'citation-pages' }}
  cancel-in-progress: false
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - name: Build encrypted dashboard
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        env:
          DASHBOARD_PASSWORD: ${{ secrets.DASHBOARD_PASSWORD }}
          PREVIOUS_DASHBOARD_PASSWORD: ${{ secrets.PREVIOUS_DASHBOARD_PASSWORD }}
        run: python tracker.py --build-only
      - uses: actions/configure-pages@v5
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
      - uses: actions/upload-pages-artifact@v3
        if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
        with:
          path: site
  deploy:
    if: github.event_name == 'push' && github.ref_name == github.event.repository.default_branch
    needs: check
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy dashboard
        id: deployment
        uses: actions/deploy-pages@v4
